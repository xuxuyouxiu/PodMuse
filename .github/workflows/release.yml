name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build installer
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # 产物名以 electron-builder.yml 的 artifactName 为准（PodMuse-Setup-${version}.exe）
          # 附 latest.yml + blockmap，应用内 electron-updater 才能检测到更新
          files: |
            dist-exe/PodMuse-Setup-*.exe
            dist-exe/PodMuse-Setup-*.exe.blockmap
            dist-exe/latest.yml
