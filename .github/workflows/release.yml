name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build installer
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # 产物名以 electron-builder.yml 的 artifactName 为准（PodMuse-Setup-${version}.exe）
          # 附 latest.yml + blockmap，应用内 electron-updater 才能检测到更新
          files: |
            dist-exe/PodMuse-Setup-*.exe
            dist-exe/PodMuse-Setup-*.exe.blockmap
            dist-exe/latest.yml

      - name: Sync to Aliyun OSS（国内更新通道）
        if: ${{ secrets.OSS_AK_ID != '' }}
        env:
          OSS_AK_ID: ${{ secrets.OSS_AK_ID }}
          OSS_AK_SECRET: ${{ secrets.OSS_AK_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
        run: |
          pip install oss2 --quiet
          python scripts/sync-release-oss.py
