<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
        color: #1f2328;
        font-size: 12.5px;
        line-height: 1.75;
      }
      /* 封面 */
      .cover {
        page-break-after: always;
        height: 90vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .cover__brand {
        font-size: 20px;
        font-weight: 800;
        color: #8b5cf6;
        letter-spacing: 0.2em;
        margin-bottom: 28px;
      }
      .cover__title {
        font-size: 34px;
        font-weight: 800;
      }
      .cover__meta {
        margin-top: 16px;
        color: #888;
        font-size: 13px;
      }
      /* 目录 */
      .toc {
        page-break-after: always;
        padding-top: 30px;
      }
      .toc h2 {
        font-size: 18px;
        margin-bottom: 16px;
        padding-bottom: 8px;
        border-bottom: 2px solid #8b5cf6;
      }
      .toc ol {
        padding-left: 22px;
      }
      .toc li {
        padding: 5px 0;
        font-size: 13px;
      }
      /* 正文页 */
      .page {
        page-break-after: always;
      }
      .note h1 {
        font-size: 20px;
        margin-bottom: 14px;
        padding-bottom: 8px;
        border-bottom: 1px solid #e5e7eb;
      }
      .note h2 {
        font-size: 15px;
        margin: 18px 0 8px;
        color: #111;
      }
      .note h3 {
        font-size: 13.5px;
        margin: 14px 0 6px;
      }
      .note p {
        margin: 6px 0;
      }
      .note ul,
      .note ol {
        padding-left: 22px;
        margin: 6px 0;
      }
      .note li {
        margin: 3px 0;
      }
      .note blockquote {
        border-left: 3px solid #8b5cf6;
        background: #f6f4fe;
        padding: 8px 12px;
        margin: 8px 0;
        color: #555;
      }
      .note code {
        background: #f3f4f6;
        padding: 1px 5px;
        border-radius: 3px;
        font-size: 11.5px;
      }
      .note pre {
        background: #f8f9fa;
        padding: 10px;
        border-radius: 6px;
        overflow-x: auto;
      }
      .note a {
        color: #6d28d9;
        text-decoration: none;
        border-bottom: 1px dotted #8b5cf6;
        word-break: break-all;
      }
      .note hr {
        border: none;
        border-top: 1px solid #e5e7eb;
        margin: 12px 0;
      }
      .note table {
        border-collapse: collapse;
        margin: 8px 0;
      }
      .note th,
      .note td {
        border: 1px solid #d1d5db;
        padding: 4px 10px;
      }
      .note strong {
        color: #111;
      }
    </style>
  </head>
  <body>
    <!-- CONTENT -->
  </body>
</html>
