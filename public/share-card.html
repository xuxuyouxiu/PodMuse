<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1080px;
        height: 1440px;
        overflow: hidden;
      }
      body {
        font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
        background: linear-gradient(160deg, #14141c 0%, #1e1b33 55%, #191434 100%);
        color: #e6e6ef;
        display: flex;
        flex-direction: column;
        padding: 72px 76px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .brand__logo {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: linear-gradient(135deg, #8b5cf6, #6d28d9);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        font-weight: 800;
        color: #fff;
      }
      .brand__text {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .brand__name {
        font-size: 40px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      .brand__slogan {
        font-size: 22px;
        color: #9a9aad;
        letter-spacing: 0.06em;
      }
      .meta {
        margin-top: 64px;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .meta__platform {
        font-size: 24px;
        font-weight: 700;
        color: #a78bfa;
        background: rgba(139, 92, 246, 0.16);
        border: 1px solid rgba(139, 92, 246, 0.4);
        border-radius: 999px;
        padding: 8px 22px;
      }
      .meta__podcast {
        font-size: 26px;
        color: #9a9aad;
      }
      .title {
        margin-top: 40px;
        font-size: 64px;
        font-weight: 800;
        line-height: 1.32;
        letter-spacing: -0.01em;
        color: #ffffff;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .divider {
        margin-top: 44px;
        height: 2px;
        background: linear-gradient(90deg, #8b5cf6 0%, rgba(139, 92, 246, 0.15) 100%);
        border-radius: 1px;
      }
      .points {
        margin-top: 48px;
        display: flex;
        flex-direction: column;
        gap: 30px;
      }
      .point {
        display: flex;
        align-items: flex-start;
        gap: 22px;
      }
      .point__dot {
        flex-shrink: 0;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #8b5cf6;
        margin-top: 16px;
        box-shadow: 0 0 0 6px rgba(139, 92, 246, 0.15);
      }
      .point__text {
        font-size: 32px;
        line-height: 1.5;
        color: #d8d8e4;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .chips {
        margin-top: auto;
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }
      .chip {
        font-size: 26px;
        font-weight: 600;
        border-radius: 999px;
        padding: 10px 24px;
      }
      .chip--person {
        color: #c4b5fd;
        background: rgba(167, 139, 250, 0.14);
        border: 1px solid rgba(167, 139, 250, 0.35);
      }
      .chip--concept {
        color: #fde68a;
        background: rgba(250, 204, 21, 0.12);
        border: 1px solid rgba(250, 204, 21, 0.3);
      }
      .chip--project {
        color: #86efac;
        background: rgba(74, 222, 128, 0.12);
        border: 1px solid rgba(74, 222, 128, 0.3);
      }
      .chip--term {
        color: #d1d5db;
        background: rgba(209, 213, 219, 0.1);
        border: 1px solid rgba(209, 213, 219, 0.25);
      }
      .footer {
        margin-top: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .footer__date {
        font-size: 24px;
        color: #6b6b7d;
      }
      .footer__brand {
        font-size: 24px;
        font-weight: 700;
        color: #8b5cf6;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <div class="brand__logo">P</div>
      <div class="brand__text">
        <div class="brand__name">PodMuse</div>
        <div class="brand__slogan">把播客变成知识库</div>
      </div>
    </div>

    <div class="meta">
      <span class="meta__platform" id="platform"></span>
      <span class="meta__podcast" id="podcast"></span>
    </div>

    <div class="title" id="title"></div>

    <div class="divider"></div>

    <div class="points" id="points"></div>

    <div class="chips" id="chips"></div>

    <div class="footer">
      <span class="footer__date" id="date"></span>
      <span class="footer__brand">PODMUSE</span>
    </div>

    <script>
      const params = new URLSearchParams(location.search)
      const get = k => {
        try {
          return decodeURIComponent(params.get(k) || '')
        } catch {
          return params.get(k) || ''
        }
      }

      const title = get('title')
      const podcast = get('podcast')
      const platform = get('platform')
      const date = get('date')
      const points = get('points') ? JSON.parse(get('points')) : []
      const chips = get('chips') ? JSON.parse(get('chips')) : []

      document.getElementById('platform').textContent = platform || '播客'
      document.getElementById('podcast').textContent = podcast || ''
      document.getElementById('title').textContent = title || '本期节目'
      document.getElementById('date').textContent = date || ''

      const pointsEl = document.getElementById('points')
      if (points.length === 0) {
        pointsEl.style.display = 'none'
      } else {
        points.forEach(text => {
          const row = document.createElement('div')
          row.className = 'point'
          const dot = document.createElement('span')
          dot.className = 'point__dot'
          const t = document.createElement('span')
          t.className = 'point__text'
          t.textContent = text
          row.appendChild(dot)
          row.appendChild(t)
          pointsEl.appendChild(row)
        })
      }

      const chipsEl = document.getElementById('chips')
      if (chips.length === 0) {
        chipsEl.style.display = 'none'
      } else {
        chips.forEach(c => {
          const el = document.createElement('span')
          el.className = 'chip chip--' + (c.type || 'term')
          el.textContent = c.name
          chipsEl.appendChild(el)
        })
      }

      // 渲染完成标记（主进程截图时机）
      document.body.dataset.ready = '1'
    </script>
  </body>
</html>
