<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1080px;
        overflow: hidden;
      }
      body {
        /* 高度随内容自适应：最短 1080，内容多自动撑高（由主进程测量后调整窗口） */
        min-height: 1080px;
        font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
        /* 米白「内容杂志」底 */
        background: #fbfaf7;
        color: #1a1a1a;
        display: flex;
        flex-direction: column;
        padding: 64px 76px 56px;
      }

      /* ── 顶部：品牌退到第二层 ── */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .topbar__brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .topbar__logo {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: #7c3aed;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 19px;
        font-weight: 800;
        color: #fff;
      }
      .topbar__name {
        font-size: 19px;
        font-weight: 600;
        color: #6b7280;
        letter-spacing: 0.04em;
      }
      .topbar__date {
        font-size: 17px;
        color: #9ca3af;
        letter-spacing: 0.06em;
      }

      /* ── 标题：绝对主角 ── */
      .title {
        margin-top: 48px;
        font-size: 62px;
        font-weight: 800;
        line-height: 1.3;
        letter-spacing: 0.005em;
        color: #111111;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .title-rule {
        margin-top: 28px;
        height: 2px;
        width: 64px;
        background: #7c3aed;
        border-radius: 1px;
      }

      /* ── 摘要 ── */
      .summary {
        margin-top: 26px;
        font-size: 27px;
        line-height: 1.65;
        color: #4b5563;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* ── 知识点列表（杂志式编号） ── */
      .points {
        margin-top: 44px;
        display: flex;
        flex-direction: column;
        gap: 34px;
      }
      .point {
        display: flex;
        gap: 24px;
      }
      .point__num {
        flex-shrink: 0;
        font-size: 26px;
        font-weight: 700;
        color: #7c3aed;
        width: 58px;
        text-align: right;
        padding-top: 3px;
      }
      .point__body {
        flex: 1;
        border-left: 1px solid #e8e4dc;
        padding-left: 24px;
      }
      .point__title {
        font-size: 30px;
        font-weight: 700;
        color: #18181b;
      }
      .point__desc {
        margin-top: 8px;
        font-size: 25px;
        line-height: 1.55;
        color: #52525b;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* ── 步骤（方法论型） ── */
      .steps {
        margin-top: 44px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .step {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .step__num {
        flex-shrink: 0;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: #f1ecfe;
        color: #7c3aed;
        font-size: 24px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .step__text {
        font-size: 28px;
        font-weight: 600;
        color: #27272a;
      }
      .step__arrow {
        flex-shrink: 0;
        color: #c4b5fd;
        font-size: 26px;
        font-weight: 700;
      }

      /* ── 金句框 ── */
      .quotebox {
        margin-top: 52px;
        background: #f5f1fd;
        border-radius: 18px;
        padding: 44px 48px;
      }
      .quotebox__text {
        font-size: 31px;
        font-weight: 700;
        line-height: 1.6;
        color: #2e1065;
      }

      /* ── 金句型卡片：极简居中（无装饰引号） ── */
      .quote-hero {
        margin-top: 100px;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 40px;
      }
      .quote-hero__text {
        font-size: 64px;
        font-weight: 800;
        line-height: 1.5;
        color: #111111;
        max-width: 860px;
      }
      .quote-hero__sub {
        font-size: 26px;
        color: #6b7280;
        line-height: 1.7;
        max-width: 780px;
      }

      /* ── 对比分析模板：双列对比 ── */
      .compare {
        margin-top: 52px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 26px;
      }
      .compare__col {
        border-radius: 18px;
        padding: 40px 36px;
      }
      .compare__col--left {
        background: #f3f1ed;
        border: 1px solid #e8e4dc;
      }
      .compare__col--right {
        background: #f5f1fd;
        border: 1px solid #e2d9f8;
      }
      .compare__head {
        font-size: 29px;
        font-weight: 800;
        text-align: center;
        margin-bottom: 30px;
      }
      .compare__col--left .compare__head {
        color: #6b7280;
      }
      .compare__col--right .compare__head {
        color: #6d28d9;
      }
      .compare__item {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        font-size: 25px;
        line-height: 1.5;
        color: #3f3f46;
        margin-bottom: 22px;
      }
      .compare__item:last-child {
        margin-bottom: 0;
      }
      .compare__dot {
        flex-shrink: 0;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-top: 14px;
      }
      .compare__col--left .compare__dot {
        background: #d1d5db;
      }
      .compare__col--right .compare__dot {
        background: #7c3aed;
      }

      /* ── 框架流程模板：纵向节点 ── */
      .framework {
        margin-top: 56px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .fnode {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        border: 2px solid #e2d9f8;
        border-radius: 999px;
        padding: 20px 42px;
        font-size: 28px;
        font-weight: 700;
        color: #4c1d95;
      }
      .fnode--start {
        background: #7c3aed;
        border-color: #7c3aed;
        color: #fff;
      }
      .flink {
        width: 2px;
        height: 44px;
        background: #d8ccf7;
        position: relative;
      }
      .flink::after {
        content: '';
        position: absolute;
        bottom: -4px;
        left: 50%;
        transform: translateX(-50%);
        border-left: 7px solid transparent;
        border-right: 7px solid transparent;
        border-top: 9px solid #b9a5f0;
      }

      /* ── 极简海报模板 ── */
      .poster {
        margin-top: 130px;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 44px;
      }
      .poster__rule {
        width: 56px;
        height: 3px;
        background: #7c3aed;
        border-radius: 2px;
      }
      .poster__title {
        font-size: 88px;
        font-weight: 800;
        line-height: 1.35;
        color: #111111;
        max-width: 880px;
        letter-spacing: 0.01em;
      }
      .poster__sub {
        font-size: 28px;
        color: #6b7280;
        line-height: 1.7;
        max-width: 720px;
      }

      /* ── 底部 ── */
      .footer {
        margin-top: auto;
        padding-top: 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid #ece8e0;
      }
      .footer__src {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 21px;
        color: #6b7280;
      }
      .footer__src-dot {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: #7c3aed;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        color: #fff;
        font-weight: 700;
      }
      .footer__brand {
        text-align: right;
        font-size: 20px;
        color: #9ca3af;
        line-height: 1.5;
      }
      .footer__brand b {
        color: #7c3aed;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <!-- 顶部小品牌 -->
    <div class="topbar">
      <div class="topbar__brand">
        <div class="topbar__logo">P</div>
        <span class="topbar__name">PodMuse · AI 知识卡片</span>
      </div>
      <span class="topbar__date" id="date"></span>
    </div>

    <!-- 金句型：极简居中 -->
    <div class="quote-hero" id="quoteHero" style="display: none">
      <div class="quote-hero__text" id="quoteText"></div>
      <div class="quote-hero__sub" id="quoteSub"></div>
    </div>

    <!-- 极简海报型 -->
    <div class="poster" id="posterCard" style="display: none">
      <div class="poster__rule"></div>
      <div class="poster__title" id="posterTitle"></div>
      <div class="poster__sub" id="posterSub"></div>
    </div>

    <!-- 对比分析型 -->
    <div id="compareCard" style="display: none">
      <div class="title" id="compareTitle"></div>
      <div class="title-rule"></div>
      <div class="summary" id="compareSummary"></div>
      <div class="compare" id="compareBox"></div>
    </div>

    <!-- 框架流程型 -->
    <div id="frameworkCard" style="display: none">
      <div class="title" id="frameworkTitle"></div>
      <div class="title-rule"></div>
      <div class="summary" id="frameworkSummary"></div>
      <div class="framework" id="frameworkBox"></div>
    </div>

    <!-- 常规型：标题 + 摘要 + 知识点/步骤 -->
    <div id="normalCard">
      <div class="title" id="title"></div>
      <div class="title-rule"></div>
      <div class="summary" id="summary"></div>
      <div class="points" id="points"></div>
      <div class="steps" id="steps"></div>
      <div class="quotebox" id="quotebox">
        <div class="quotebox__text" id="quote"></div>
      </div>
    </div>

    <!-- 底部 -->
    <div class="footer">
      <div class="footer__src">
        <span class="footer__src-dot">♪</span>
        <span id="source"></span>
      </div>
      <div class="footer__brand">由 <b>PodMuse</b> 整理<br />把播客变成你的知识库</div>
    </div>

    <script>
      const params = new URLSearchParams(location.search)
      const get = k => {
        try {
          return decodeURIComponent(params.get(k) || '')
        } catch {
          return params.get(k) || ''
        }
      }
      const jget = k => {
        try {
          return JSON.parse(get(k) || '[]')
        } catch {
          return []
        }
      }

      const template = get('template') || 'summary'
      const title = get('title')
      const summary = get('summary')
      const quote = get('quote')
      const points = jget('points')
      const steps = jget('steps')
      const compare = jget('compare')
      const source = get('source')
      const date = get('date')

      document.getElementById('date').textContent = date || ''

      const srcEl = document.getElementById('source')
      srcEl.textContent = source ? '来源：' + source : ''

      if (template === 'quote') {
        document.getElementById('quoteHero').style.display = 'flex'
        document.getElementById('normalCard').style.display = 'none'
        // 金句模板主角 = 金句本身（quote 字段）；副行 = 摘要
        document.getElementById('quoteText').textContent = quote || title || '本期节目'
        document.getElementById('quoteSub').textContent = summary || ''
      } else if (template === 'poster') {
        document.getElementById('posterCard').style.display = 'flex'
        document.getElementById('normalCard').style.display = 'none'
        document.getElementById('posterTitle').textContent = title || '本期节目'
        document.getElementById('posterSub').textContent = quote || summary || ''
      } else if (template === 'compare') {
        document.getElementById('compareCard').style.display = 'block'
        document.getElementById('normalCard').style.display = 'none'
        document.getElementById('compareTitle').textContent = title || '本期节目'
        document.getElementById('compareSummary').textContent = summary || ''
        const box = document.getElementById('compareBox')
        const mkCol = (cls, head, items) => {
          const col = document.createElement('div')
          col.className = 'compare__col ' + cls
          const h = document.createElement('div')
          h.className = 'compare__head'
          h.textContent = head || ''
          col.appendChild(h)
          ;(items || []).forEach(text => {
            const row = document.createElement('div')
            row.className = 'compare__item'
            const dot = document.createElement('span')
            dot.className = 'compare__dot'
            const t = document.createElement('span')
            t.textContent = text
            row.appendChild(dot)
            row.appendChild(t)
            col.appendChild(row)
          })
          return col
        }
        box.appendChild(
          mkCol('compare__col--left', compare.leftTitle || '做法 A', compare.leftItems),
        )
        box.appendChild(
          mkCol('compare__col--right', compare.rightTitle || '做法 B', compare.rightItems),
        )
      } else if (template === 'framework') {
        document.getElementById('frameworkCard').style.display = 'block'
        document.getElementById('normalCard').style.display = 'none'
        document.getElementById('frameworkTitle').textContent = title || '本期节目'
        document.getElementById('frameworkSummary').textContent = summary || ''
        const box = document.getElementById('frameworkBox')
        ;(steps || []).forEach((text, i) => {
          const node = document.createElement('div')
          node.className = 'fnode' + (i === 0 ? ' fnode--start' : '')
          node.textContent = text
          box.appendChild(node)
          if (i < steps.length - 1) {
            const link = document.createElement('div')
            link.className = 'flink'
            box.appendChild(link)
          }
        })
      } else {
        document.getElementById('title').textContent = title || '本期节目'
        document.getElementById('summary').textContent = summary || ''

        if (template === 'steps' && steps.length > 0) {
          document.getElementById('points').style.display = 'none'
          const stepsEl = document.getElementById('steps')
          steps.forEach((text, i) => {
            const row = document.createElement('div')
            row.className = 'step'
            const num = document.createElement('span')
            num.className = 'step__num'
            num.textContent = String(i + 1).padStart(2, '0')
            const t = document.createElement('span')
            t.className = 'step__text'
            t.textContent = text
            row.appendChild(num)
            row.appendChild(t)
            if (i < steps.length - 1) {
              const arrow = document.createElement('span')
              arrow.className = 'step__arrow'
              arrow.textContent = '↓'
              row.appendChild(arrow)
            }
            stepsEl.appendChild(row)
          })
          if (quote) {
            document.getElementById('quote').textContent = quote
          } else {
            document.getElementById('quotebox').style.display = 'none'
          }
        } else {
          document.getElementById('steps').style.display = 'none'
          const pointsEl = document.getElementById('points')
          if (points.length === 0) {
            pointsEl.style.display = 'none'
          } else {
            points.forEach(p => {
              const t = typeof p === 'string' ? { title: '', desc: p } : p
              const row = document.createElement('div')
              row.className = 'point'
              const num = document.createElement('span')
              num.className = 'point__num'
              num.textContent = String(points.indexOf(p) + 1).padStart(2, '0')
              const body = document.createElement('div')
              body.className = 'point__body'
              if (t.title) {
                const h = document.createElement('div')
                h.className = 'point__title'
                h.textContent = t.title
                body.appendChild(h)
              }
              const d = document.createElement('div')
              d.className = 'point__desc'
              d.textContent = t.desc || t.title
              body.appendChild(d)
              row.appendChild(num)
              row.appendChild(body)
              pointsEl.appendChild(row)
            })
          }
          if (quote) {
            document.getElementById('quote').textContent = quote
          } else {
            document.getElementById('quotebox').style.display = 'none'
          }
        }
      }

      document.body.dataset.ready = '1'
    </script>
  </body>
</html>
