appId: com.podcastnotes.app
productName: PodMuse
directories:
  output: dist-exe
files:
  - dist/**/*
  - dist-electron/**/*
extraResources:
  - from: podcast_config.example.json
    to: podcast_config.json
  - from: obsidian_templates
    to: obsidian_templates
  - from: build/icon.png
    to: build/icon.png
extraFiles:
  - from: node_modules/electron/dist/ffmpeg.dll
    to: ffmpeg.dll
  - from: build/yt-dlp.exe
    to: yt-dlp.exe
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: PodMuse-Setup-${version}.${ext}
