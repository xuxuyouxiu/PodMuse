appId: com.podcastnotes.app
productName: 播客笔记助手
directories:
  output: dist-exe
files:
  - dist/**/*
  - dist-electron/**/*
extraResources:
  - from: podcast_config.example.json
    to: podcast_config.json
  - from: obsidian_templates
    to: obsidian_templates
  - from: build/icon.png
    to: build/icon.png
extraFiles:
  - from: node_modules/electron/dist/ffmpeg.dll
    to: ffmpeg.dll
win:
  target:
    - nsis
    - portable
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: 播客笔记助手-Setup-${version}.${ext}
portable:
  artifactName: 播客笔记助手-Portable-${version}.${ext}
